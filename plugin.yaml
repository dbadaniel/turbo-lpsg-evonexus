id: turbo-lpsg
name: Turbo LPSG
version: 0.1.0
description: Metodo e squad para planejar e executar lancamentos pagos semanais no EvoNexus.
author: Turbo Academy
license: MIT AND CC-BY-NC-SA-4.0
homepage: https://github.com/dbadaniel/turbo-lpsg-evonexus

min_evonexus_version: 0.33.0
tier: essential

capabilities:
  - agents
  - skills
  - sql_migrations
  - readonly_data
  - writable_data
  - public_pages

env_vars_needed: []
conflicts: {}
dependencies: {}
source_url: https://github.com/dbadaniel/turbo-lpsg-evonexus

agents:
  - file: agents/automacao-turbo.md
  - file: agents/closer-turbo.md
  - file: agents/copywriter-turbo.md
  - file: agents/cs-turbo.md
  - file: agents/designer-turbo.md
  - file: agents/diretor-criativo-turbo.md
  - file: agents/estrategista-turbo.md
  - file: agents/pesquisador-mercado-turbo.md
  - file: agents/pesquisador-turbo.md
  - file: agents/picasso-auditor-lpsg.md
  - file: agents/revisor-copy-turbo.md
  - file: agents/social-turbo.md
  - file: agents/trafego-turbo.md

writable_data:
  - id: plugin_lpsg_lancamentos
    description: Tabela para armazenar as configuracoes dos lancamentos
    table: turbo_lpsg_lancamentos
    allowed_columns: [id, cliente_id, nome, produto_principal, meta_inscritos, data_inicio, data_fim, config_json]
  - id: plugin_lpsg_vendas
    description: Tabela para armazenar as vendas de cada lancamento
    table: turbo_lpsg_vendas
    allowed_columns: [id, lancamento_id, cliente_id, produto, tipo, valor, pagamento, status, contact_id, utm_source, utm_medium, utm_campaign, first_utm_source, first_utm_medium, first_utm_campaign, lote, etapa, dia, criado_em]

readonly_data:
  - id: get_vendas_dashboard
    description: Busca todas as vendas de um lancamento especifico para o dashboard
    sql: "SELECT * FROM turbo_lpsg_vendas WHERE lancamento_id = :token_val"
    public_via: sales_dashboard
    bind_token_param: token_val
  - id: get_lancamento_config
    description: Busca a configuracao do lancamento a partir do token
    sql: "SELECT * FROM turbo_lpsg_lancamentos WHERE id = :token_val"
    public_via: sales_dashboard
    bind_token_param: token_val

public_pages:
  - id: sales_dashboard
    description: Dashboard publico para acompanhamento das vendas e KPIs do lancamento
    route_prefix: dash
    token_source:
      table: turbo_lpsg_lancamentos
      column: id
    bundle: ui/public/dashboard.js
    custom_element_name: lpsg-sales-dashboard
    auth_mode: token

