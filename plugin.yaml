id: turbo-lpsg
name: Turbo LPSG
version: 0.1.0
description: Metodo e squad para planejar e executar lancamentos pagos semanais no EvoNexus.
author: Turbo Academy
license: MIT AND CC-BY-NC-SA-4.0
homepage: https://github.com/dbadaniel/turbo-lpsg-evonexus

min_evonexus_version: 0.33.0
tier: essential

capabilities:
  - agents
  - skills
  - sql_migrations
  - readonly_data
  - writable_data
  - public_pages
  - ui_pages

env_vars_needed: []
conflicts: {}
dependencies:
  python:
    packages:
      python-docx: ">=1.1,<2"
      pyyaml: ">=6.0"

prerequisites:
