    required: true
    instructions: "Configure o servidor MCP do Google Drive para permitir que o orquestrador e os agentes criem e subam os briefings narrativos (.docx) automaticamente para a nuvem."

source_url: https://github.com/dbadaniel/turbo-lpsg-evonexus

